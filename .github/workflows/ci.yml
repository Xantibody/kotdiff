name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # package.json / 両 manifest のバージョンは常に一致させる (CLAUDE.md の制約)
      - name: Verify version consistency
        run: |
          pkg=$(node -p "require('./package.json').version")
          for f in manifest.chrome.json manifest.firefox.json; do
            v=$(node -p "require('./$f').version")
            if [ "$v" != "$pkg" ]; then
              echo "::error::$f の version ($v) が package.json ($pkg) と一致しません"
              exit 1
            fi
          done

      - name: Format check
        run: pnpm run fmt:check
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test:run
      - name: Build
        run: pnpm run build
